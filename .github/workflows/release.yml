name: Release

# On every published GitHub release: the CLI Docker image is pushed to GHCR
# (ghcr.io/ateeducacion/elpx-optimizer), and to Docker Hub
# (ateeducacion/elpx-optimizer) when the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# secrets exist, as `latest` and with the release version, the web app is deployed to GitHub Pages, and the CLI, the Agent
# Skill and the static web build are attached to the release. Each image
# architecture is built on a native runner (no emulation) and the two are
# joined into one multi-platform image. The CLI is
# published on npm when the repository variable NPM_PUBLISH is "true"
# (docs/npm.md).
#
# Run by hand with an existing release tag to publish that release's images
# and web app again with this workflow (a re-run would use the workflow of
# the tagged commit).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish again (e.g. v0.1.1)
        required: true
      latest:
        description: Also move the `latest` image tags to it
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.0
  NODE_VERSION: 24
  # The Docker image (the CLI; the web app is on GitHub Pages).
  IMAGE: elpx-optimizer
  # The tag being published: the release's, or the one given by hand.
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  images:
    name: Docker image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE }}
            org.opencontainers.image.description=eXeLearning project optimizer (command line)
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      # Pushed by digest only; the manifests job gives the tags to both architectures at once.
      - id: build
        uses: docker/build-push-action@v7
        env:
          # The build record (.dockerbuild) artifact is not used by anyone.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          target: cli
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=cli-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=cli-${{ matrix.arch }}
      - name: Export the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifests:
    name: Docker image (multi-platform)
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      # Docker Hub gets the same image when the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets exist.
      DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' && secrets.DOCKERHUB_USERNAME != '' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.DOCKERHUB == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}
            name=docker.io/${{ github.repository_owner }}/${{ env.IMAGE }},enable=${{ env.DOCKERHUB }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'release' || inputs.latest }}
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
      # Tags for GHCR and, when enabled, Docker Hub, which gets a copy of the images pushed to GHCR.
      - name: Create the multi-platform image
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}@sha256:%s ' *)
      - name: Inspect
        run: |
          docker buildx imagetools inspect 'ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}:${{ steps.meta.outputs.version }}'
          if [ "$DOCKERHUB" = true ]; then
            docker buildx imagetools inspect 'docker.io/${{ github.repository_owner }}/${{ env.IMAGE }}:${{ steps.meta.outputs.version }}'
          fi

  pages:
    name: Web app on GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '${{ env.BUN_VERSION }}' }
      - run: bun install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@v6
      # Absolute URLs for the social preview (og:image, twitter:image).
      - run: bun run build:web
        env:
          ELPX_SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist/web }
      - id: deploy
        uses: actions/deploy-pages@v5

  assets:
    name: Release assets
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '${{ env.BUN_VERSION }}' }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: bun install --frozen-lockfile
      - run: make build
      - name: Package
        run: |
          (cd dist/cli && npm pack --pack-destination ..)
          (cd dist/skill && zip -qr ../elpx-optimizer-skill.zip elpx-optimizer)
          tar -C dist -czf dist/elpx-optimizer-web.tar.gz web
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/elpx-optimizer-[0-9]*.tgz dist/elpx-optimizer-skill.zip dist/elpx-optimizer-web.tar.gz --clobber

  npm:
    name: npm package
    # Off until the package exists on npm with this workflow as its trusted publisher (docs/npm.md).
    if: github.event_name == 'release' && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance, no token stored
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '${{ env.BUN_VERSION }}' }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}', registry-url: 'https://registry.npmjs.org' }
      - run: bun install --frozen-lockfile
      - run: bun run build:cli
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer.
      - run: npm install -g npm@11
      - name: The package version is the release tag
        run: test "v$(node -p "require('./dist/cli/package.json').version")" = "${{ github.event.release.tag_name }}"
      - run: npm publish --provenance --access public
        working-directory: dist/cli
