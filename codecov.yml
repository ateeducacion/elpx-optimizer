# Coverage from the "Tests and coverage" CI job (Vitest, Node and Chromium merged; lcov).
# vitest.config.ts fails CI under 90% of the whole code; Codecov adds a status on every pull
# request that fails when the project drops under 90% or the changed lines are under 90% covered.
coverage:
  status:
    project:
      default:
        target: 90%
    patch:
      default:
        target: 90%
comment:
  layout: 'condensed_header, diff, files'
  require_changes: true
